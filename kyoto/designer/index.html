<title>京都の暮らし 設計室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* 配置：上に固定の帳場（状態・保存）、その下に見出しタブ。中身は1列の帳面。スマホ縦が基準 */
:root{
  --paper:#f4f6f9; --panel:#ffffff; --ink:#1c2433; --muted:#5a6476; --line:#d7dce6; --soft:#e9edf4;
  --ai:#2d4a8c; --ai-ink:#ffffff; --shu:#c4462b; --shu-soft:#fbe9e4; --ok:#2c7a57; --bad:#b0261c; --bad-soft:#fbe7e5;
  --f-pix:"DotGothic16","BIZ UDPGothic",system-ui,sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151c; --panel:#191f29; --ink:#e6eaf1; --muted:#9ba4b6; --line:#2d3544; --soft:#222a37;
  --ai:#8ea7ea; --ai-ink:#0f1522; --shu:#ff8d70; --shu-soft:#3a2420; --ok:#71d0a1; --bad:#ff8e85; --bad-soft:#3b2222; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151c; --panel:#191f29; --ink:#e6eaf1; --muted:#9ba4b6; --line:#2d3544; --soft:#222a37;
  --ai:#8ea7ea; --ai-ink:#0f1522; --shu:#ff8d70; --shu-soft:#3a2420; --ok:#71d0a1; --bad:#ff8e85; --bad-soft:#3b2222; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--panel)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px 8px}
h1{font-family:var(--f-pix);font-weight:400;font-size:20px;margin:0;letter-spacing:.04em;line-height:1.2}
h1 small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:0}
.status{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.chg{border-color:var(--shu);color:var(--shu)}
.pill.err{border-color:var(--bad);color:var(--bad)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
button{font:inherit;cursor:pointer;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;min-height:36px}
button.pri{background:var(--ai);color:var(--ai-ink);border-color:var(--ai);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
button.link{border:none;background:none;color:var(--ai);padding:2px 4px;min-height:0;text-decoration:underline;font-size:13px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;font-family:var(--f-pix);font-size:15px;padding:6px 12px;white-space:nowrap;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ai)}
main{padding-block:16px 48px}
.intro{color:var(--muted);font-size:13px;margin:0 0 14px}
section.grp{margin:0 0 22px}
section.grp>h2{font-family:var(--f-pix);font-weight:400;font-size:17px;margin:0 0 4px;letter-spacing:.03em}
section.grp>p{margin:0 0 10px;color:var(--muted);font-size:13px}
.fld{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;position:relative}
.fld.changed{border-left:4px solid var(--shu);padding-left:9px}
.fld.bad{border-color:var(--bad);background:var(--bad-soft)}
.fl-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fl-head label,.fl-head .lab{font-weight:700}
.unit{font-size:12px;color:var(--muted)}
.help{margin:2px 0 6px;font-size:12.5px;color:var(--muted)}
.ins{display:flex;flex-wrap:wrap;gap:6px 10px}
.in{display:flex;flex-direction:column;gap:2px;min-width:0}
.in span{font-size:11.5px;color:var(--muted)}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;min-height:36px}
input[type=number]{width:88px;font-variant-numeric:tabular-nums;text-align:right}
input.w2{width:64px}
input[type=text]{width:100%;max-width:320px}
textarea{width:100%;min-height:76px;resize:vertical;line-height:1.7}
.fl-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fl-foot .msg{color:var(--bad);font-weight:700}
.fld:not(.changed) .rst{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.note{font-size:13px;color:var(--muted)}
.banner{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:0 0 14px;font-size:13px;background:var(--soft)}
.banner.bad{border-color:var(--bad);background:var(--bad-soft)}
/* 境遇の一覧 */
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;padding:10px 12px;width:100%}
.prow b{font-weight:700}
.prow .sub{grid-column:1/-1;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prow .pct{font-family:var(--f-pix);font-size:16px;font-variant-numeric:tabular-nums}
.prow.changed{border-left:4px solid var(--shu)}
.era{font-size:12px;color:var(--muted);margin:12px 0 4px;letter-spacing:.08em}
.npcgrid{display:grid;gap:8px}
.npc{border:1px dashed var(--line);border-radius:var(--r);padding:8px}
.npc h4{margin:0 0 6px;font-size:13px}
/* 変更一覧 */
.diff{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.diff .what{min-width:0}
.diff .what small{display:block;color:var(--muted);font-size:12px;word-break:break-all}
.diff .vals{font-variant-numeric:tabular-nums;font-size:13px;word-break:break-all}
.diff .vals s{color:var(--muted)}
.diff .vals b{color:var(--shu)}
/* 試遊 */
.play{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#000;max-width:430px;margin:0 auto}
.play iframe{display:block;width:100%;height:min(780px,78vh);border:0;background:var(--panel)}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;width:0;background:var(--ai);transition:width .2s}
.res{display:grid;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 12px;font-variant-numeric:tabular-nums;font-size:13.5px}
.kv .h{color:var(--muted);font-size:12px}
.hist{display:grid;gap:3px;font-size:12px;font-variant-numeric:tabular-nums}
.hrow{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center}
.hbar{position:relative;height:16px;background:var(--soft);border-radius:3px}
.hbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.hbar i.d{background:var(--line)}
.hbar i.n{background:var(--ai);height:8px;top:4px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin:0 0 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,0px) + 4px);z-index:9}
.fbar input[type=search]{flex:1 1 180px;min-width:0;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;min-height:36px}
.fbar select{max-width:100%;min-width:0}
.fbar label.chk{display:inline-flex;gap:5px;align-items:center;font-size:13px;min-height:36px}
.fbar .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.fbar button.link{min-height:36px}
[hidden]{display:none!important}
@media (max-width:560px){.fbar{position:static}}
.later{margin-top:28px;padding-top:14px;border-top:1px dashed var(--line)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:99px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){.prog i{transition:none}}
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <h1>京都の暮らし 設計室<small>「2000年の地球上の誰か1人。」京都版のゲームデザイン</small></h1>
      <div class="status" aria-live="polite">
        <span class="pill" id="st-chg">変更 0件</span>
        <span class="pill" id="st-save">読み込み中</span>
        <button class="pri" id="btn-save" disabled>保存</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="設計の項目">
      <button role="tab" data-tab="num" aria-selected="true">数値</button>
      <button role="tab" data-tab="per" aria-selected="false">境遇と人物</button>
      <button role="tab" data-tab="name" aria-selected="false">名前</button>
      <button role="tab" data-tab="diff" aria-selected="false">変更一覧</button>
      <button role="tab" data-tab="play" aria-selected="false">試遊</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main">
  <p class="intro">ゲームの中身を読み込んでいます…（数秒かかります）</p>
</main>
<iframe id="simframe" title="計算用（非表示）" hidden></iframe>

<script>
/* ===== 設計室：ゲーム本体（game.html）の既定値を読み、変えた所だけを「設計データ」として保存する =====
   保存先：このページのデータベース design/current（Claude が読んで本体へ反映する）。使えないときは、この端末の下書きだけ。 */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=v=>JSON.parse(JSON.stringify(v));
const r12=v=>Number(Number(v).toPrecision(12));
const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const DRAFT_KEY='kyoto-designer-draft-v1';
const GAME_KEY_PREFIX='kyoto-kurashi-mihon-v4';
let GAME=null,DEF=null,META=null,cur=null,dbRef=null,dbOk=false,saved=null,errs={},tab='num',perSel=null,lastApplied=null,appliedInfo={},simBusy=false;

/* ---------- 項目の定義（数値タブ） ----------
   path：値の場所（vars の名前から）。shape：n＝数1つ／a＝数の並び／p＝最小・最大の組／pp＝組の並び／o＝名前つきの数
   scale：画面の表示＝内部の値×scale。min/max は画面の表示の単位 */
const KIND={a:'自動の出来事',s:'小さな選択',b:'大きな選択'};
/* ---------- 検索・絞り込み（数値タブ・変更一覧タブ） ---------- */
const FLT={num:{q:'',g:'',chg:false,bad:false},diff:{q:'',k:''}};
const norm=s=>String(s).normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const hit=(hay,q)=>{const t=norm(q).split(/\s+/).filter(Boolean);if(!t.length)return true;const h=norm(hay);return t.every(w=>h.includes(w))};
function fbarHTML(kind,opts){
  const s=FLT[kind];
  return `<div class="fbar" role="search" data-fk="${kind}">
    <input type="search" id="fq" value="${esc(s.q)}" placeholder="${kind==='num'?'項目名・説明で探す（例：死亡、★、家計）':'変えた項目・値で探す'}" aria-label="検索" autocomplete="off" enterkeyhint="search">
    <select id="fsel" aria-label="${kind==='num'?'グループで絞り込む':'種類で絞り込む'}">${opts.map(([v,l])=>`<option value="${esc(v)}"${v===(kind==='num'?s.g:s.k)?' selected':''}>${esc(l)}</option>`).join('')}</select>
    ${kind==='num'?`<label class="chk"><input type="checkbox" id="fchg"${s.chg?' checked':''}>変えた項目だけ</label><label class="chk"><input type="checkbox" id="fbad"${s.bad?' checked':''}>誤りだけ</label>`:''}
    <button class="link" id="fclr" type="button">条件をクリア</button>
    <span class="cnt" id="fcnt" aria-live="polite"></span>
  </div>`;
}
function fActive(kind){const s=FLT[kind];return kind==='num'?!!(s.q.trim()||s.g||s.chg||s.bad):!!(s.q.trim()||s.k)}
function applyNumFilter(){
  const s=FLT.num;let vis=0,tot=0;
  document.querySelectorAll('#main section.grp[data-g]').forEach(sec=>{
    const gt=sec.querySelector('h2').textContent;let v=0;
    sec.querySelectorAll('.fld').forEach(f=>{
      tot++;
      const hay=gt+' '+[...f.querySelectorAll('.fl-head,.help,.in span')].map(x=>x.textContent).join(' ');
      const ok=(!s.g||s.g===sec.dataset.g)&&hit(hay,s.q)&&(!s.chg||f.classList.contains('changed'))&&(!s.bad||f.classList.contains('bad'));
      f.hidden=!ok;if(ok)v++;
    });
    sec.hidden=v===0;vis+=v;
  });
  const c=$('#fcnt');if(c)c.textContent=fActive('num')?`${vis}件 / 全${tot}件`:`全${tot}件`;
  const e=$('#fempty');if(e)e.hidden=vis>0;
}
function applyDiffFilter(){
  const s=FLT.diff;let vis=0,tot=0;
  document.querySelectorAll('#main .diff').forEach(d=>{
    tot++;const ok=(!s.k||d.dataset.k===s.k)&&hit(d.dataset.q,s.q);d.hidden=!ok;if(ok)vis++;
  });
  const c=$('#fcnt');if(c)c.textContent=fActive('diff')?`${vis}件 / 全${tot}件`:`全${tot}件`;
  const e=$('#fempty');if(e)e.hidden=vis>0;
  const u=$('#undo-note');if(u)u.hidden=!fActive('diff');
}
function onFilterInput(e){
  const bar=e.target.closest('.fbar');const kind=bar.dataset.fk,s=FLT[kind],id=e.target.id;
  if(id==='fq')s.q=e.target.value;
  else if(id==='fsel'){if(kind==='num')s.g=e.target.value;else s.k=e.target.value}
  else if(id==='fchg')s.chg=e.target.checked;
  else if(id==='fbad')s.bad=e.target.checked;
  (kind==='num'?applyNumFilter:applyDiffFilter)();
}
function clearFilter(kind){
  Object.assign(FLT[kind],kind==='num'?{q:'',g:'',chg:false,bad:false}:{q:'',k:''});
  (kind==='num'?renderNum:renderDiff)();
}
function numSchema(){
  const st=META.stats, pol=META.policies;
  return [
  {id:'life',title:'寿命と死亡',intro:'毎年、亡くなる確率＝「高齢の分×体力の補正×病気の倍率」＋「乳幼児の分」＋「事故」。境遇による直接の補正はありません。',fields:[
    {path:['MAXAGE'],shape:'n',label:'寿命の上限',unit:'歳',min:50,max:150,int:true,help:'この年齢になると必ず人生が終わります（強制の上限）。'},
    {path:['HZ','B'],shape:'n',label:'高齢による死亡の起点',unit:'10万分の1',scale:1e5,min:0,max:100,step:0.1,help:'0歳時点の「高齢の分」の大きさ。大きいほど全体に早く亡くなります。'},
    {path:['HZ','k'],shape:'n',label:'年齢による増え方',min:0,max:0.3,step:0.005,help:'1歳ごとに「高齢の分」が約 e^値 倍になります（0.09なら1年で約1.09倍、10年で約2.5倍）。'},
    {path:['HZ','child'],shape:'n',label:'0歳の死亡率のもと',unit:'%',scale:100,min:0,max:50,step:0.1,help:'乳幼児の分の0歳での大きさ。'},
    {path:['HZ','childDecay'],shape:'n',label:'乳幼児の死亡率の下がり方',min:0,max:5,step:0.05,help:'大きいほど、1歳・2歳…と急に下がります。'},
    {path:['HZ','acc'],shape:'n',label:'事故で亡くなる確率',unit:'%（1年あたり）',scale:100,min:0,max:5,step:0.01},
    {path:['HZ','illMult'],shape:'n',label:'病気（風邪）の間の倍率',unit:'倍',min:1,max:20,step:0.1},
    {path:['HZ','sevMult'],shape:'n',label:'重い病の間の倍率',unit:'倍',min:1,max:50,step:0.1}]},
  {id:'fam',title:'家族と時間の進み方',intro:'誕生時の家族の決まり方と、時間の進む単位・速さ。',fields:[
    {path:['FAM_MISS'],shape:'n',label:'養育者の片方が欠ける確率',unit:'%',scale:100,min:0,max:100,step:1,help:'欠けた場合は祖母が加わります。'},
    {path:['FAM_SIB'],shape:'a',sub:['0人','1人','2人'],label:'兄弟姉妹の人数の割合',unit:'%（合計100）',min:0,max:100,step:1,sum:100},
    {path:['FAM_ELDER'],shape:'n',label:'兄・姉として生まれる割合',unit:'%',scale:100,min:0,max:100,step:1,help:'残りは、後から生まれる弟・妹になります。'},
    {path:['SWITCH_AGE'],shape:'p',sub:['から','まで'],label:'1年ごとの進行に切り替わる年齢',unit:'歳',min:1,max:110,int:true,help:'それまでは四半期（春夏秋冬）ごとに進みます。誕生時にこの範囲から1つ選ばれます。'},
    {path:['SPEEDS'],shape:'a',sub:['×1','×2','×4','×30'],label:'1回（四半期または1年）にかかる時間',unit:'秒',scale:0.001,min:0.2,max:600,step:0.1,help:'演出の待ち時間だけが変わり、結果は変わりません。'}]},
  {id:'birth',title:'生まれつきの能力と★',intro:'能力は0〜1000。★（1〜5）は、学びや仕事などの活動で伸びるときの伸びやすさです。',fields:[
    {path:['AB_RANGE'],shape:'pp',rows:st,sub:['最小','最大'],label:'生まれた時の能力の範囲',min:0,max:1000,int:true,help:'3つの乱数の平均で引くので、真ん中付近が出やすくなります。生まれつきの差は、成長後の水準（境遇の「能力の目安」）にも2倍で残ります。'},
    {path:['STAR_W_BIRTH'],shape:'a',sub:['★1','★2','★3','★4','★5'],label:'★の出やすさ（生まれた人）',unit:'割合',min:0,max:1000,step:1,help:'数の比で決まります（合計は100でなくてもかまいません）。'},
    {path:['STAR_W_ADULT'],shape:'a',sub:['★1','★2','★3','★4','★5'],label:'★の出やすさ（13歳以上で現れた人物）',unit:'割合',min:0,max:1000,step:1}]},
  {id:'grow',title:'成長と★の上下',intro:'活動の積み重ね（経験）が溜まると★が上がり、使わない年が続くと下がります。',fields:[
    {path:['STAR_MULT'],shape:'a',sub:['★1','★2','★3','★4','★5'],label:'★ごとの成長の倍率',unit:'倍',min:0,max:10,step:0.05,help:'活動による成長（プラスの分）だけに掛かります。年齢による成長・回復には掛かりません。'},
    {path:['XP_UP'],shape:'a',sub:['★1→2','★2→3','★3→4','★4→5'],label:'★が上がるのに必要な経験',min:1,max:5000,step:1},
    {path:['XP_DOWN'],shape:'a',idx:[1,2,3,4],sub:['★2→1','★3→2','★4→3','★5→4'],label:'★が下がる目減りの量',min:0,max:5000,step:1,help:'経験がこの分だけマイナスになると★が1つ下がります。'},

const NS_LABEL={noble:'貴族（平安）',heian:'平安',muro:'室町',edo:'江戸',showa:'昭和',mod:'1970年代〜',n:'男女どちらでも'};

/* ---------- 値の出し入れ ---------- */
const getP=(o,p)=>p.reduce((a,k)=>a==null?a:a[k],o);
function setP(o,p,v){let a=o;for(let i=0;i<p.length-1;i++)a=a[p[i]];a[p[p.length-1]]=v}
const toDisp=(raw,f)=>raw==null?'':r12(raw*(f.scale||1));
const toRaw=(d,f)=>r12(d/(f.scale||1));
/* 1つの項目の入力欄の並び：[{sub, raw}]（表示の単位で） */
function cells(f,obj){
  const v=getP(obj,f.path);
  if(f.shape==='n')return [{sub:'',raw:v,i:null}];
  if(f.shape==='a')return (f.idx||v.map((_,i)=>i)).map((i,j)=>({sub:f.sub[j],raw:v[i],i}));
  if(f.shape==='p')return v.map((x,i)=>({sub:f.sub[i],raw:x,i}));
  if(f.shape==='o')return f.keys.map((k,j)=>({sub:f.sub[j],raw:v[k],i:k}));
  if(f.shape==='pp')return v.flatMap((pr,r)=>pr.map((x,i)=>({sub:`${f.rows[r]}・${f.sub[i]}`,raw:x,i:[r,i]})));
}
function putCell(f,i,raw){
  const v=clone(getP(cur.vars,f.path));
  if(f.shape==='n'){setP(cur.vars,f.path,raw);return}
  if(f.shape==='pp')v[i[0]][i[1]]=raw;else v[i]=raw;
  setP(cur.vars,f.path,v);
}
function checkNum(f,raw){
  const d=toDisp(raw,f);
  if(!Number.isFinite(raw))return '数字を入れてください';
  if(f.int&&!Number.isInteger(d))return '整数で入れてください';
  if(f.rawInt&&!Number.isInteger(raw))return f.rawInt;
  if(f.min!=null&&d<f.min)return `${f.min}以上にしてください`;
  if(f.max!=null&&d>f.max)return `${f.max}以下にしてください`;
  return '';
}
function checkField(f){
  for(const c of cells(f,cur.vars)){const m=checkNum(f,c.raw);if(m)return `${c.sub?c.sub+'：':''}${m}`}
  const v=getP(cur.vars,f.path);
  if(f.sum!=null&&Math.abs(v.reduce((a,b)=>a+b,0)-f.sum)>1e-9)return `合計を${f.sum}にしてください（今は${r12(v.reduce((a,b)=>a+b,0))}）`;
  if(f.shape==='p'&&v[0]>v[1])return '「最小（から）」を「最大（まで）」以下にしてください';
  if(f.shape==='pp'){const r=v.findIndex(pr=>pr[0]>pr[1]);if(r>=0)return `${f.rows[r]}：最小を最大以下にしてください`}
  if(f.path[0].startsWith('STAR_W')&&v.reduce((a,b)=>a+b,0)<=0)return 'どれか1つは0より大きくしてください';
  return '';
}

/* ---------- 差分（＝設計データ） ---------- */
function design(){
  const d={v:DEF.v,vars:{},personas:{}};
  for(const k in cur.vars)if(!eq(cur.vars[k],DEF.vars[k]))d.vars[k]=clone(cur.vars[k]);
  for(const p in cur.personas)for(const f in cur.personas[p])if(!eq(cur.personas[p][f],DEF.personas[p][f])){(d.personas[p]=d.personas[p]||{})[f]=clone(cur.personas[p][f])}
  if(!Object.keys(d.personas).length)delete d.personas;
  return d;
}
function diffList(){
  const out=[],sch=numSchema();
  for(const g of sch)for(const f of g.fields){const a=getP(DEF.vars,f.path),b=getP(cur.vars,f.path);if(!eq(a,b))out.push({grp:g.title,label:f.label,a:fmtVal(f,a),b:fmtVal(f,b),undo:()=>{setP(cur.vars,f.path,clone(a))}})}
  if(!eq(cur.vars.NAMEP,DEF.vars.NAMEP))for(const s in DEF.vars.NAMEP){const a=DEF.vars.NAMEP[s],b=cur.vars.NAMEP[s];if(!eq(a,b))out.push({grp:'名前',label:NS_LABEL[s]||s,a:nameCount(a),b:nameCount(b),undo:()=>{cur.vars.NAMEP[s]=clone(a)}})}
  for(const p of pOrder())for(const f in cur.personas[p]){const a=DEF.personas[p][f],b=cur.personas[p][f];if(!eq(a,b))out.push({grp:'境遇：'+DEF.personas[p].label,label:pfLabel(f),a:fmtPV(f,a),b:fmtPV(f,b),undo:()=>{cur.personas[p][f]=clone(a)}})}
  return out;
}
const nameCount=v=>Array.isArray(v)?`${v.length}個`:`男${v.m.length}・女${v.f.length}個`;
function fmtVal(f,v){return cells(f,{x:0,...Object.fromEntries([[f.path[0],f.path.length>1?{[f.path[1]]:v}:v]])}).map(c=>(c.sub?c.sub+' ':'')+toDisp(c.raw,f)).join('、')}
const pfLabel=f=>({npc:'周りの人',npcoff:'周りの人の年齢差',npcsk:'周りの人の技能',npcskn:'周りの人の技能名'}[f]||(PF.find(x=>x.f===f)||{}).label||f);
function fmtPV(f,v){
  if(f==='npc')return v.map(r=>`${r[0]}（${r[1]}・好感${r[2]}・${r[3]==null?'出来事で':r[3]+'歳'}）`).join('／');
  if(f==='famneed')return v.join('と');
  if(f==='ns')return NS_LABEL[v]||v;
  if(Array.isArray(v))return v.join('、');
  return v===''?'（空欄）':String(v);
}
const changedCount=()=>diffList().length;

/* ---------- 境遇 ---------- */
const pOrder=()=>Object.keys(cur.personas).sort((a,b)=>cur.personas[a].yr[0]-cur.personas[b].yr[0]||a.localeCompare(b));
function birthProbs(){            // ゲームの randomBirth と同じ：西暦1〜1900年が一様、その年に生まれうる境遇の重みで選ぶ
  const ks=Object.keys(cur.personas),p=Object.fromEntries(ks.map(k=>[k,0]));const holes=[];let hs=null;
  for(let y=1;y<=1900;y++){
    const c=ks.filter(k=>y>=cur.personas[k].yr[0]&&y<cur.personas[k].yr[1]&&cur.personas[k].randw>0);
    const t=c.reduce((a,k)=>a+cur.personas[k].randw,0);
    if(!c.length||t<=0){if(hs==null)hs=y}else{if(hs!=null){holes.push([hs,y-1]);hs=null}c.forEach(k=>p[k]+=cur.personas[k].randw/t)}
  }
  if(hs!=null)holes.push([hs,1900]);
  for(const k in p)p[k]=p[k]/1900*100;
  return {p,holes};
}
function checkPersona(k,f){
  const v=cur.personas[k][f],d=PF.find(x=>x.f===f);
  if(['label','place','name','skillName'].includes(f))return (typeof v==='string'&&v.trim()&&v.length<=40)?'':'1〜40文字で入れてください';
  if(f==='kid')return v.length<=40?'':'40文字以内にしてください';
  if(f==='yr'){if(!v.every(Number.isInteger))return '整数で入れてください';if(v[0]<1)return '1年以上にしてください';if(v[1]>2001)return '「まで」は2001以下にしてください';if(v[0]>=v[1])return '「から」を「まで」より小さくしてください';return ''}
  if(f==='randw')return Number.isFinite(v)&&v>=0&&v<=1000?'':'0〜1000の数にしてください';
  if(f==='stats')return v.every(x=>Number.isInteger(x)&&x>=0&&x<=1000)?'':'0〜1000の整数にしてください';
  if(f==='npc'){for(const r of v){if(!r[0].trim()||r[0].length>40)return '役割名を1〜40文字で';if(!(Number.isInteger(r[2])&&r[2]>=0&&r[2]<=100))return '好感度は0〜100の整数で';if(r[3]!=null&&!(Number.isInteger(r[3])&&r[3]>=0&&r[3]<=110))return '知り合う年齢は0〜110の整数か空欄で'}return ''}
  if(f==='npcoff')return v.every(x=>Number.isInteger(x)&&x>=-20&&x<=80)?'':'年齢差は−20〜80の整数で';
  if(f==='npcsk')return v.every(x=>Number.isInteger(x)&&x>=0&&x<=1000)?'':'技能は0〜1000の整数で';
  if(f==='npcskn')return v.every(x=>typeof x==='string'&&x.trim()&&x.length<=40)?'':'技能名を1〜40文字で';
  return '';
}

/* ---------- 全体の誤り ---------- */
function allErrors(){
  const out=[];
  for(const g of numSchema())for(const f of g.fields){const m=checkField(f);if(m)out.push(`${f.label}：${m}`)}
  for(const k in cur.personas)for(const f in cur.personas[k]){const m=checkPersona(k,f);if(m)out.push(`${cur.personas[k].label||k}・${pfLabel(f)}：${m}`)}
  for(const s in cur.vars.NAMEP){const v=cur.vars.NAMEP[s];const lists=Array.isArray(v)?[v]:[v.m,v.f];if(lists.some(l=>!l.length))out.push(`名前（${NS_LABEL[s]||s}）：1つ以上入れてください`);if(lists.some(l=>l.some(n=>n.length>40)))out.push(`名前（${NS_LABEL[s]||s}）：1つの名前は40文字以内に`)}
  const {holes}=birthProbs();
  holes.forEach(h=>out.push(`ランダム出生：${h[0]}〜${h[1]}年に生まれられる境遇がありません（重みが0より大きい境遇の生まれ年を広げてください）`));
  for(const k in errs)if(errs[k])out.push(errs[k]);
  return out;
}

/* ---------- 画面の更新 ---------- */
function refreshStatus(){
  const n=changedCount(),e=allErrors(),dirty=!eq(design(),saved);
  const c=$('#st-chg');c.textContent=`変更 ${n}件`;c.className='pill'+(n?' chg':'');
  const s=$('#st-save');
  if(e.length){s.textContent=`誤り ${e.length}件`;s.className='pill err'}
  else if(dirty){s.textContent=dbOk?'未保存':'未保存（この端末）';s.className='pill chg'}
  else{s.textContent=dbOk?'保存済み':'下書きのみ';s.className='pill ok'}
  $('#btn-save').disabled=!dbOk||!!e.length||!dirty;
  try{localStorage.setItem(DRAFT_KEY,JSON.stringify({at:Date.now(),dirty,data:design()}))}catch(x){}
}
let toastT=null;
function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}

  </div>`;

function onNumInput(e){

function updateField(fid){

  box.classList.toggle('changed',changed);box.classList.toggle('bad',!!m);box.querySelector('.msg').textContent=m;
}

function pInput(k,f,d){

  if(d.kind==='text')return `<input type="text" id="${id}" data-pk="${k}" data-pf="${f}" value="${esc(v)}" maxlength="40" ${d.opt?'placeholder="（空欄）"':''}>`;
  if(d.kind==='num')return `<input type="number" inputmode="decimal" id="${id}" data-pk="${k}" data-pf="${f}" value="${v}" step="${d.step||1}" min="${d.min}" max="${d.max}">`;
  if(d.kind==='pair')return `<div class="ins">${v.map((x,i)=>`<label class="in"><span>${esc(d.sub[i])}</span><input type="number" inputmode="numeric" id="${id}-${i}" data-pk="${k}" data-pf="${f}" data-i="${i}" value="${x}" step="1"></label>`).join('')}</div>`;

function onPerInput(e){
  const el=e.target;
  if(el.dataset.pk){
    const k=el.dataset.pk,f=el.dataset.pf,P=cur.personas[k];
    if(f==='famneed')P.famneed=el.value==='母父'?['母','父']:[el.value];
    else if(f==='ns'||['label','place','kid','name','skillName'].includes(f))P[f]=el.value;
    else if(f==='randw'){const n=el.value===''?NaN:Number(el.value);if(Number.isFinite(n)){P.randw=n;delete errs['p-'+k+'-randw']}else errs['p-'+k+'-randw']=`${P.label}・ランダムの重み：数字を入れてください`}
    else{const i=+el.dataset.i,n=el.value===''?NaN:Number(el.value);const ek=`p-${k}-${f}-${i}`;if(Number.isFinite(n)){const a=P[f].slice();a[i]=n;P[f]=a;delete errs[ek]}else errs[ek]=`${P.label}・${pfLabel(f)}：数字を入れてください`}
    const box=document.getElementById('pf-'+f);
    if(box){const m=Object.keys(errs).some(x=>x.startsWith(`p-${k}-${f}`))?'数字を入れてください':checkPersona(k,f);box.classList.toggle('changed',!eq(P[f],DEF.personas[k][f]));box.classList.toggle('bad',!!m);box.querySelector('.msg').textContent=m;}
    if(f==='label'){const h=$('#main h2');if(h)h.textContent=P.label}
  }else if(el.dataset.nk){
    const k=el.dataset.nk,i=+el.dataset.ni,c=el.dataset.nc,P=cur.personas[k];const ek=`n-${k}-${i}-${c}`;
    if(c==='0'||c==='1'){const npc=clone(P.npc);npc[i][+c]=el.value;P.npc=npc}
    else if(c==='skn'){const a=P.npcskn.slice();a[i]=el.value;P.npcskn=a}
    else{
      const raw=el.value.trim();
      if(c==='3'&&raw===''){const npc=clone(P.npc);npc[i][3]=null;P.npc=npc;delete errs[ek]}
      else{const n=raw===''?NaN:Number(raw);
        if(!Number.isFinite(n))errs[ek]=`${P.label}・周りの人${i+1}人目：数字を入れてください`;
        else{delete errs[ek];
          if(c==='2'||c==='3'){const npc=clone(P.npc);npc[i][+c]=n;P.npc=npc}
          else if(c==='off'){const a=P.npcoff.slice();a[i]=n;P.npcoff=a}
          else if(c==='sk'){const a=P.npcsk.slice();a[i]=n;P.npcsk=a}}}
    }
    const box=$('#pf-npcs');
    if(box){const fs=['npc','npcoff','npcsk','npcskn'];const m=Object.keys(errs).some(x=>x.startsWith(`n-${k}-`))?'数字を入れてください':(fs.map(f=>checkPersona(k,f)).find(Boolean)||'');
      box.classList.toggle('changed',fs.some(f=>!eq(P[f],DEF.personas[k][f])));box.classList.toggle('bad',!!m);box.querySelector('.msg').textContent=m}
  }
  refreshStatus();
}

function clearGameSaves(w){try{const ls=w.localStorage;for(let i=ls.length-1;i>=0;i--){const k=ls.key(i);if(k&&k.startsWith(GAME_KEY_PREFIX))ls.removeItem(k)}}catch(x){}}

function loadSim(d){

async function runSimOne(d,n,label,base,span){
  const K=await loadSim(d);K.sim.start(n);
  await new Promise(done=>{const go=()=>{const p=K.sim.step(10);const i=$('#sim-prog i');if(i)i.style.width=Math.round((base+p*span)*100)+'%';const nt=$('#sim-note');if(nt)nt.textContent=`${label}を計算中…`;if(p<1)setTimeout(go,0);else done()};go()});
  const r=K.sim.result();clearGameSaves($('#simframe').contentWindow);return r;
}
async function startSim(){
  if(simBusy)return;simBusy=true;const n=+$('#sim-n').value,cmp=$('#sim-cmp').checked;
  $('#sim-start').disabled=true;$('#sim-prog').hidden=false;
  try{
    const d=design(),hasChg=Object.keys(d.vars).length||d.personas;
    const a=await runSimOne(d,n,'今の設計',0,cmp&&hasChg?0.5:1);
    const b=cmp&&hasChg?await runSimOne({v:d.v,vars:{}},n,'既定の値',0.5,0.5):null;
    simRes={n,a,b};$('#sim-note').textContent=`${n}人ぶん計算しました。`;
    const box=$('#sim-res');if(box)box.innerHTML=simHTML(simRes);
  }catch(e){$('#sim-note').textContent='計算に失敗しました。もう一度試してください。'}
  simBusy=false;const b=$('#sim-start');if(b)b.disabled=false;
}
function stat(r){
  const a=r.ages.slice().sort((x,y)=>x-y),n=a.length||1;
  const mean=a.reduce((s,x)=>s+x,0)/n,med=a[Math.floor(n/2)]||0;
  const kid=a.filter(x=>x<=5).length/n*100,old=a.filter(x=>x>=80).length/n*100;
  const bins=Array.from({length:12},(_,i)=>a.filter(x=>Math.min(11,Math.floor(x/10))===i).length/n*100);
  return {mean,med,kid,old,max:a[a.length-1]||0,bins,sib:r.sib/(r.lives||1),miss:r.miss/(r.lives||1)*100,ch:(r.dec+r.small)/(r.lives||1)};
}
function simHTML(R){
  const A=stat(R.a),B=R.b?stat(R.b):null,f=(v,d=1)=>Number.isFinite(v)?v.toFixed(d):'—';
  const kv=(h,a,b,d)=>`<span>${h}</span><b>${a}</b><span class="note">${B?b:''}</span>`;
  const mx=Math.max(...A.bins,...(B?B.bins:[0]),1);
  const tot=Object.values(R.a.births).reduce((s,x)=>s+x,0)||1;
  const births=Object.entries(R.a.births).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`${esc(cur.personas[k]?cur.personas[k].label:k)} ${(v/tot*100).toFixed(1)}%`).join('、');
  const causes=Object.entries(R.a.causes).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`${esc(k)} ${(v/(R.a.lives||1)*100).toFixed(0)}%`).join('、');
  return `<div class="res">
    <div class="card"><div class="kv"><span class="h">${R.n}人の結果</span><span class="h">今の設計</span><span class="h">${B?'既定の値':''}</span>
      ${kv('平均寿命',f(A.mean)+'歳',B&&f(B.mean)+'歳')}${kv('寿命の中央値',A.med+'歳',B&&B.med+'歳')}${kv('5歳までに亡くなる',f(A.kid)+'%',B&&f(B.kid)+'%')}
      ${kv('80歳以上まで生きる',f(A.old)+'%',B&&f(B.old)+'%')}${kv('いちばん長生き',A.max+'歳',B&&B.max+'歳')}
      ${kv('兄弟姉妹（平均）',f(A.sib,2)+'人',B&&f(B.sib,2)+'人')}${kv('祖母が加わる',f(A.miss)+'%',B&&f(B.miss)+'%')}
      ${kv('選択の回数（1人あたり）',f(A.ch,1)+'回',B&&f(B.ch,1)+'回')}
      ${R.a.at30.map((v,i)=>kv(`30歳の${META.stats[i]}（平均）`,v,B&&R.b.at30[i])).join('')}</div></div>
    <div class="card"><b>亡くなった年齢</b><div class="legend" style="margin:4px 0 6px"><span><i style="background:var(--ai)"></i>今の設計</span>${B?'<span><i style="background:var(--line)"></i>既定の値</span>':''}</div>
      <div class="hist">${A.bins.map((v,i)=>`<div class="hrow"><span>${i===11?'110':i*10+'代'}</span><div class="hbar">${B?`<i class="d" style="width:${B.bins[i]/mx*100}%"></i>`:''}<i class="n" style="width:${v/mx*100}%"></i></div><span>${v.toFixed(0)}%</span></div>`).join('')}</div></div>
    <div class="card"><b>亡くなった理由</b><p class="note" style="margin:4px 0 0">${causes||'—'}</p></div>
    <div class="card"><b>ランダムで生まれた境遇（3000回）</b><p class="note" style="margin:4px 0 0">${births}</p></div>
    ${R.a.errors.length?`<div class="banner bad">計算中に止まった人生がありました：${R.a.errors.map(esc).join('、')}</div>`:''}
  </div>`;
}

  const t=e.target;if(!cur)return;
  if(t.id==='fclr'){clearFilter(t.closest('.fbar').dataset.fk);return}
  if(t.dataset.rst){const f=FIELD_BY_ID[t.dataset.rst];setP(cur.vars,f.path,clone(getP(DEF.vars,f.path)));Object.keys(errs).forEach(k=>{if(k.startsWith(t.dataset.rst+'-'))delete errs[k]});const box=document.getElementById(t.dataset.rst);box.outerHTML=fieldHTML(f,t.dataset.rst);refreshStatus();return}
  const pr=t.closest('[data-per]');if(pr){perSel=pr.dataset.per;renderPer();return}
  if(t.id==='per-back'){perSel=null;renderPer();return}
  if(t.dataset.prst){const k=perSel,f=t.dataset.prst;cur.personas[k][f]=clone(DEF.personas[k][f]);Object.keys(errs).forEach(x=>{if(x.startsWith(`p-${k}-${f}`))delete errs[x]});renderPerEdit(k);refreshStatus();return}
  if(t.dataset.nrst){const k=perSel;['npc','npcoff','npcsk','npcskn'].forEach(f=>{cur.personas[k][f]=clone(DEF.personas[k][f])});Object.keys(errs).forEach(x=>{if(x.startsWith(`n-${k}-`))delete errs[x]});renderPerEdit(k);refreshStatus();return}
  if(t.dataset.nmrst){cur.vars.NAMEP=clone(cur.vars.NAMEP);cur.vars.NAMEP[t.dataset.nmrst]=clone(DEF.vars.NAMEP[t.dataset.nmrst]);renderName();refreshStatus();return}
  if(t.dataset.undo!=null){diffList()[+t.dataset.undo].undo();errs={};renderDiff();refreshStatus();return}
  if(t.id==='undo-all'){if(!confirmAll){confirmAll=true;renderDiff();return}cur=clone(DEF);errs={};confirmAll=false;renderDiff();refreshStatus();toast('すべて既定に戻しました（まだ保存していません）');return}
  if(t.id==='undo-cancel'){confirmAll=false;renderDiff();return}
  if(t.id==='copy-ask'){const s=$('#ask').textContent;(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('写しました')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#ask'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('文字を選びました。コピーしてください')});return}
  if(t.id==='play-start'){startPlay();return}
  if(t.id==='sim-start'){startSim();return}
});
$('#btn-save').addEventListener('click',async()=>{
  if(!dbOk||allErrors().length)return;const d=design();$('#btn-save').disabled=true;$('#st-save').textContent='保存中…';
  try{await dbRef.set({...appliedInfo,data:d,savedAt:new Date().toISOString(),changes:changedCount()});saved=d;toast('保存しました');}
  catch(e){toast(e&&e.code==='invalid_argument'?'この閲覧権限では保存できません':'保存できませんでした。少し待ってからもう一度押してください')}
  refreshStatus();
});

/* ---------- 起動 ---------- */
function overlay(d){                  // 保存された設計を、既定値の上に重ねる（知らない項目は無視）
  if(!d)return;
  for(const k in d.vars||{})if(k in cur.vars)cur.vars[k]=clone(d.vars[k]);
  for(const p in d.personas||{})if(cur.personas[p])for(const f in d.personas[p])if(f in cur.personas[p])cur.personas[p][f]=clone(d.personas[p][f]);
}
async function boot(){
  try{const r=await fetch('game.html');if(!r.ok)throw new Error(r.status);GAME=await r.text()}
  catch(e){$('#main').innerHTML='<div class="banner bad">ゲーム本体（game.html）を読み込めませんでした。ページを開き直してください。</div>';$('#st-save').textContent='読み込み失敗';return}
  let K;try{K=await loadSim({v:1,vars:{}})}catch(e){$('#main').innerHTML='<div class="banner bad">ゲームの値を読み取れませんでした。</div>';return}
  DEF=clone(K.defaults);META=clone(K.meta);cur=clone(DEF);saved={v:DEF.v,vars:{}};
  let draft=null;try{draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null')}catch(x){}
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(x){db=null}
  if(db){dbRef=db.doc('design/current');
    try{const snap=await dbRef.get();dbOk=true;if(snap.exists){const b=snap.data();overlay(b.data);saved=design();if(b.appliedAt)appliedInfo={appliedAt:b.appliedAt,appliedCommit:b.appliedCommit||null};lastApplied=b.appliedAt?`${b.appliedAt}${b.appliedCommit?'（'+b.appliedCommit+'）':''}`:null}}
    catch(e){dbOk=false}}
  if(draft&&draft.dirty&&draft.data){cur=clone(DEF);overlay(draft.data);toast('保存していない変更を、この端末の下書きから戻しました')}
  else if(!dbOk&&draft&&draft.data){overlay(draft.data)}
  let t='num';try{t=localStorage.getItem('kyoto-designer-tab')||'num'}catch(x){}
  if(!['num','per','name','diff','play'].includes(t))t='num';
  show(t);refreshStatus();
  if(!dbOk)$('#main').insertAdjacentHTML('afterbegin','<div class="banner">保存先（データベース）に接続できないため、変更はこの端末の下書きにだけ残ります。claude.ai でこの設計室を開くと保存できます。</div>');
}
function setHH(){const h=document.querySelector('header.top');if(h)document.documentElement.style.setProperty('--hh',h.offsetHeight+'px')}
addEventListener('resize',setHH);
boot().then(setHH);
</script>
